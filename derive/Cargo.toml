[package]
name = "differential-equations-derive"
version = "0.2.0"
edition = "2024"
authors = ["Ryan D. Gast <ryan.d.gast@gmail.com>"]
description = "Derives proc macros for the differential-equations crate"

documentation = "https://docs.rs/differential-equations"
homepage = "https://github.com/Ryan-D-Gast/differential-equations"
repository = "https://github.com/Ryan-D-Gast/differential-equations"

license = "Apache-2.0"

[lib]
proc-macro = true

[dependencies]
syn = "3.0.7"
quote = "1.0.47"
proc-macro2 = "1.0.107"

[dev-dependencies]
differential-equations = { path = ".." }
nalgebra = "0.35"
num-complex = "0.4.6"
