name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - nalgebra
          - num-complex
          - ndarray
          - faer
          - polars
          - serde
          - nalgebra,num-complex,ndarray,faer,polars,serde
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --no-default-features --features "${{ matrix.features }}"
      - run: cargo clippy --no-default-features --features "${{ matrix.features }}" --all-targets -- -D warnings
      - if: matrix.features == 'nalgebra'
        run: cargo test --bench ode_solver_benchmarks --features nalgebra -- --test

  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - run: cargo test --manifest-path derive/Cargo.toml
      - run: cargo clippy --manifest-path derive/Cargo.toml --all-targets -- -D warnings
